    <!-- Külső nyolcszögletű Tatami pajzs (#18181B) krémfehér (#FAF8F5) szegéllyel -->
    <polygon points="19,2 45,2 62,19 62,45 45,62 19,62 2,45 2,19" fill="#18181B" stroke="#FAF8F5" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Belső Tatami szőnyeg-keret vonalazás -->
    <polygon points="21.5,6.5 42.5,6.5 57.5,21.5 57.5,42.5 42.5,57.5 21.5,57.5 6.5,42.5 6.5,21.5" fill="none" stroke="#FAF8F5" stroke-width="1.2" stroke-opacity="0.45" stroke-linejoin="round"/>

    <!-- Kyokushin Kanku (Égre néző kezek / Felkelő nap rombusz-csúcs) -->
    <polygon points="32,10.5 51,32 32,53.5 13,32" fill="#18181B" stroke="#FAF8F5" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Kanku központi nap-mag -->
    <circle cx="32" cy="17.5" r="2.2" fill="#FAF8F5"/>

    <!-- Belső Torii & Obi (Fekete öv) "TM" Monogram -->
    <!-- T-gerenda és középső oszlop -->
    <path d="M20 24.5H44" stroke="#FAF8F5" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M32 24.5V46" stroke="#FAF8F5" stroke-width="2.6" stroke-linecap="round"/>
    <!-- M-küzdőállás ívek -->
    <path d="M22.5 41.5V29.5L32 37.5L41.5 29.5V41.5" stroke="#FAF8F5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATAMI MASTER™ - Átirányítás...</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script>
        (function () {
            var isAdmin = false;
            try {
                var raw = localStorage.getItem('tatamiUser');
                var user = raw ? JSON.parse(raw) : null;
                isAdmin = !!(user && user.role && String(user.role).toUpperCase() === 'ADMIN');
            } catch (e) {}
            var search = window.location.search || '';
            var target = isAdmin ? ('admin.html' + search + '#tab-agrajz') : ('audience.html' + search);
            window.location.replace(target);
        })();
    </script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;padding:40px;text-align:center;background:#FAF8F5;color:#18181B;">
    <p>A Kumite ágrajzok és mérkőzések megtekintése az Admin Központban és az Élő Követés felületen érhető el. Átirányítás...</p>
    <p><a id="fallbackLink" href="audience.html" style="color:#18181B;font-weight:700;">Tovább a megfelelő felületre</a></p>
    <script>
        (function () {
            var a = document.getElementById('fallbackLink');
            if (!a) return;
            try {
                var raw = localStorage.getItem('tatamiUser');
                var user = raw ? JSON.parse(raw) : null;
                var search = window.location.search || '';
                a.href = (user && user.role && String(user.role).toUpperCase() === 'ADMIN')
                    ? ('admin.html' + search + '#tab-agrajz')
                    : ('audience.html' + search);
            } catch (e) {}
        })();
    </script>
</body>
</html>

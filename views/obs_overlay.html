<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>TATAMI MASTER™ - OBS Live Stream Overlay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Bahnschrift', 'DIN Alternate', 'Franklin Gothic Medium', 'Segoe UI', sans-serif; }
        body {
            background: transparent !important;
            font-family: 'Bahnschrift', 'DIN Alternate', 'Franklin Gothic Medium', 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }
        /* FELSŐ KATEGÓRIA JELZŐ (BAL FELSŐ SAROK) */
        .obs-top-badge {
            position: fixed;
            top: 32px;
            left: 48px;
            background: rgba(24, 24, 27, 0.94);
            color: #FAF8F5;
            padding: 10px 22px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .obs-live-dot {
            width: 10px;
            height: 10px;
            background: #991B1B;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 50% { opacity: 0.25; } }

        .obs-round-pill {
            background: #27272A;
            color: #FAF8F5;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .obs-round-pill.overtime {
            background: #991B1B;
        }

        /* ALSÓ TELEVÍZIÓS SCOREBOARD (LOWER THIRD) */
        .obs-lower-bar {
            position: fixed;
            bottom: 38px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1380px;
            background: rgba(24, 24, 27, 0.95);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.65);
            border: 1.5px solid rgba(255,255,255,0.18);
        }
        .obs-kumite-row {
            display: grid;
            grid-template-columns: 1fr 110px 220px 110px 1fr;
            align-items: center;
            height: 96px;
        }
        .obs-fighter {
            padding: 0 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .obs-aka {
            background: linear-gradient(90deg, rgba(136, 19, 19, 0.95) 0%, rgba(92, 13, 13, 0.88) 100%);
            color: #fff;
        }
        .obs-shiro {
            background: linear-gradient(270deg, rgba(250, 248, 245, 0.96) 0%, rgba(228, 224, 215, 0.92) 100%);
            color: #18181B;
            text-align: right;
        }
        .obs-name {
            font-size: 1.75rem;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .obs-pen {
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0.9;
            margin-top: 3px;
        }
        .obs-score {
            font-size: 3.4rem;
            font-weight: 800;
            text-align: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #18181B;
            color: #FAF8F5;
        }
        .obs-timer-cell {
            background: #0F0F12;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 2px solid #27272A;
            border-right: 2px solid #27272A;
        }
        .obs-timer {
            font-size: 2.85rem;
            font-weight: 800;
            text-align: center;
            color: #FAF8F5;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .obs-subround {
            font-size: 0.78rem;
            font-weight: 800;
            color: #E4E0D7;
            letter-spacing: 0.8px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        /* KATA NÉZET OBS-BEN */
        .obs-kata-row {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            color: white;
            height: 96px;
        }
        .obs-kata-judges {
            display: flex;
            gap: 12px;
        }
        .obs-j-pill {
            background: #27272A;
            border: 1.5px solid #52525B;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1.35rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="obs-top-badge">
        <div class="obs-live-dot"></div>
        <span id="obsMatchInfo">1. TATAMI — ÉLŐ KÖZVETÍTÉS</span>
        <span id="obsRoundBadge" class="obs-round-pill">ALAPIDŐ</span>
    </div>

    <div class="obs-lower-bar">
        <!-- KUMITE SÁV -->
        <div id="obsKumiteRow" class="obs-kumite-row">
            <div class="obs-fighter obs-aka">
                <div id="obsAkaName" class="obs-name">AKA Versenyző</div>
                <div id="obsAkaPen" class="obs-pen">Chui / Genten: 0</div>
            </div>
            <div id="obsAkaScore" class="obs-score">0</div>
            <div class="obs-timer-cell">
                <div id="obsTimer" class="obs-timer">02:00</div>
                <div id="obsSubRound" class="obs-subround">ALAPIDŐ</div>
            </div>
            <div id="obsShiroScore" class="obs-score">0</div>
            <div class="obs-fighter obs-shiro">
                <div id="obsShiroName" class="obs-name">SHIRO Versenyző</div>
                <div id="obsShiroPen" class="obs-pen" style="color:#991B1B;">Chui / Genten: 0</div>
            </div>
        </div>

        <!-- KATA SÁV -->
        <div id="obsKataRow" class="obs-kata-row">
            <div>
                <div style="font-size:0.8rem;color:#E4E0D7;font-weight:800;letter-spacing:1px;">KATA BEMUTATÓ</div>
                <div id="obsKataName" class="obs-name">Versenyző Neve</div>
            </div>
            <div class="obs-kata-judges">
                <div id="obsB1" class="obs-j-pill" style="border-color:#FAF8F5;">B1: -</div>
                <div id="obsB2" class="obs-j-pill">B2: -</div>
                <div id="obsB3" class="obs-j-pill">B3: -</div>
                <div id="obsB4" class="obs-j-pill">B4: -</div>
                <div id="obsB5" class="obs-j-pill">B5: -</div>
            </div>
            <div style="text-align:right;">
                <div style="font-size:0.75rem;color:#A1A1AA;font-weight:800;">ÖSSZPONTSZÁM</div>
                <div id="obsKataTotal" style="font-size:2.8rem;font-weight:800;color:#FAF8F5;line-height:1;">0.0</div>
            </div>
        </div>
    </div>

    <script src="../JS/core.js?v=20261112_v11"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tatamiSzam = urlParams.get('tatami');

        function formazObsBuntetes(b) {
            const p = parseInt(b) || 0;
            if (p === 0) return 'Nincs (0)';
            if (p === 1) return '1x Chui';
            if (p === 2) return '2x Chui';
            if (p === 3) return '1x GENTEN';
            return 'SIKAKU (2G)';
        }

        function frissitObs() {
            const d = (typeof TatamiMaster !== 'undefined')
                ? TatamiMaster.lekerLiveTatamiAllapot(tatamiSzam)
                : null;
            if (!d) return;

            try {
                document.getElementById('obsMatchInfo').innerText = d.matchInfo || 'TATAMI ÉLŐ STREAM';
                const isKata = (d.mode && d.mode.toUpperCase() === 'KATA');

                document.getElementById('obsKumiteRow').style.display = isKata ? 'none' : 'grid';
                document.getElementById('obsKataRow').style.display = isKata ? 'flex' : 'none';

                const rLabel = d.roundLabel || (isKata ? 'KATA' : 'ALAPIDŐ');
                const rBadge = document.getElementById('obsRoundBadge');
                if (rBadge) {
                    rBadge.innerText = rLabel;
                    if (d.roundCode && d.roundCode !== 'ALAP' && !isKata) {
                        rBadge.classList.add('overtime');
                    } else {
                        rBadge.classList.remove('overtime');
                    }
                }
                const subR = document.getElementById('obsSubRound');
                if (subR) subR.innerText = rLabel;

                document.getElementById('obsAkaName').innerText = d.akaName || 'AKA';
                document.getElementById('obsShiroName').innerText = d.shiroName || 'SHIRO';
                document.getElementById('obsAkaScore').innerText = d.akaScore ?? 0;
                document.getElementById('obsShiroScore').innerText = d.shiroScore ?? 0;
                document.getElementById('obsAkaPen').innerText = 'Büntetés: ' + formazObsBuntetes(d.akaPenalties);
                document.getElementById('obsShiroPen').innerText = 'Büntetés: ' + formazObsBuntetes(d.shiroPenalties);
                document.getElementById('obsTimer').innerText = d.timer || '02:00';

                document.getElementById('obsKataName').innerText = d.akaName || '-';
                document.getElementById('obsKataTotal').innerText = d.kataTotal || '0.0';
                const sc = d.kataScores || ['-','-','-','-','-'];
                for (let i = 0; i < 5; i++) {
                    const el = document.getElementById('obsB' + (i + 1));
                    el.innerText = `B${i+1}: ${sc[i] || '-'}`;
                    el.style.opacity = (i === d.kataMinIdx || i === d.kataMaxIdx) ? '0.35' : '1';
                }
            } catch (e) {}
        }

        if (typeof TatamiMaster !== 'undefined') {
            TatamiMaster.on('liveTatamiFrissult', frissitObs);
        }
        window.addEventListener('storage', frissitObs);
        setInterval(frissitObs, 250);
        frissitObs();
    </script>
</body>
</html>

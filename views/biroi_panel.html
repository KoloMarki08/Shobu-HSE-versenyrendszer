<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Master - Vezérlőpult</title>
    <link rel="stylesheet" href="../CSS/stlye.css">
</head>
<body style="background-color: #333;"> 
    
    <header class="top-header">
        <h1><em>TATAMI MASTER</em> <span class="red-text">VEZÉRLŐPULT</span></h1>
        
        <!-- TV megnyitása gomb -->
        <button class="btn btn-outline-blue" style="position: absolute; right: 150px; top: 15px; font-weight: bold; background: white;" onclick="window.open('tv_kijelzo.html', '_blank')">📺 TV Kijelző Megnyitása</button>
        
        <button class="btn btn-outline" style="position: absolute; right: 20px; top: 15px; color: white; border-color: white;" onclick="window.location.href='../index.html'">Kijelentkezés</button>
    </header>

    <main class="scoreboard-container" style="height: auto;">
        
        <!-- PIROS OLDAL (AKA) VEZÉRLŐ -->
        <div class="fighter-card aka-card">
            <h2 class="fighter-title">AKA Vezérlő</h2>
            <div class="score-display" id="akaScore">0</div>
            
            <div class="point-buttons">
                <button class="btn btn-outline" style="background: white; color: black;" onclick="addPoint('aka', 'waza-ari')">+ Waza-ari (1)</button>
                <button class="btn btn-outline" style="background: white; color: black;" onclick="addPoint('aka', 'ippon')">+ Ippon (2)</button>
            </div>
            <button class="btn btn-outline" style="margin-top: 15px; border-color: white; color: white;" onclick="resetPoint('aka')">Pontok törlése</button>
        </div>

        <!-- IDŐMÉRŐ VEZÉRLŐ -->
        <div class="center-console">
            <h3>Időmérő</h3>
            <div class="timer-display" id="timerDisplay">02:00</div>
            
            <div class="timer-controls">
                <button class="btn btn-outline-green" onclick="startTimer()">Start</button>
                <button class="btn btn-outline" style="background-color: #dc3545; color: white; border: none;" onclick="stopTimer()">Stop</button>
                <button class="btn btn-outline-blue" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- FEHÉR OLDAL (SHIRO) VEZÉRLŐ -->
        <div class="fighter-card shiro-card">
            <h2 class="fighter-title">SHIRO Vezérlő</h2>
            <div class="score-display" id="shiroScore" style="color: #333;">0</div>
            
            <div class="point-buttons">
                <button class="btn btn-outline" style="background-color: #333; color: white;" onclick="addPoint('shiro', 'waza-ari')">+ Waza-ari (1)</button>
                <button class="btn btn-outline" style="background-color: #333; color: white;" onclick="addPoint('shiro', 'ippon')">+ Ippon (2)</button>
            </div>
            <button class="btn btn-outline" style="margin-top: 15px; border-color: #333; color: #333;" onclick="resetPoint('shiro')">Pontok törlése</button>
        </div>

    </main>

    <script src="../JS/biroi_panel.js"></script>
</body>
</html>

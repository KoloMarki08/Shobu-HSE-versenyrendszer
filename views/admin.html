<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Master - Admin Panel</title>
    <!-- Ugyanazt a CSS-t használjuk, hogy egységes maradjon a dizájn -->
    <link rel="stylesheet" href="../CSS/stlye.css">
</head>
<body>
    <header class="top-header">
        <h1><em>TATAMI MASTER</em> <span class="red-text">ADMIN PANEL</span></h1>
        <!-- Egy egyszerű kijelentkezés gomb a fejléc jobb oldalára -->
        <button class="btn btn-outline" style="position: absolute; right: 20px; top: 15px;" onclick="window.location.href='../index.html'">Kijelentkezés</button>
    </header>

    <main class="admin-container">
        <!-- A fülek (Tabok) menüsora -->
        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'versenyzok')">Versenyzők</button>
            <button class="tab-button" onclick="openTab(event, 'kategoriak')">Kategóriák</button>
            <button class="tab-button" onclick="openTab(event, 'nevezesek')">Nevezések</button>
            <button class="tab-button" onclick="openTab(event, 'tatamik')">Tatamik & Sorsolás</button>
        </div>

        <!-- A fülek tartalma -->
        <div id="versenyzok" class="tab-content active">
            <h2>Versenyzők kezelése</h2>
            
            <!-- Új versenyző hozzáadása űrlap -->
            <div class="add-form-container">
                <input type="text" id="ujVersenyzoNev" placeholder="Versenyző neve" class="input-field">
                <input type="text" id="ujVersenyzoKlub" placeholder="Klub (pl. Shobu HSE)" class="input-field">
                <button class="btn btn-outline-green" onclick="hozzadVersenyzo()">Hozzáadás</button>
            </div>

            <!-- Ide generáljuk a táblázatot a JavaScriptből -->
            <div id="versenyzokTableContainer">
                <p>Adatok betöltése...</p>
            </div>
        </div>

        <div id="kategoriak" class="tab-content">
            <h2>Kategóriák kezelése</h2>
            
            <!-- Új kategória hozzáadása űrlap -->
            <div class="add-form-container">
                <input type="text" id="ujKategoriaNev" placeholder="Kategória neve (pl. Junior Fiú Kumite)" class="input-field">
                <button class="btn btn-outline-blue" onclick="hozzadKategoria()">Hozzáadás</button>
            </div>

            <!-- Ide generáljuk a táblázatot -->
            <div id="kategoriakTableContainer">
                <p>Adatok betöltése...</p>
            </div>
        </div>

        <div id="nevezesek" class="tab-content">
            <h2>Nevezések áttekintése</h2>
            
            <!-- Új nevezés hozzáadása űrlap -->
            <div class="add-form-container">
                <select id="ujNevezesVersenyzo" class="input-field">
                    <option value="">Válassz versenyzőt...</option>
                </select>
                
                <select id="ujNevezesKategoria" class="input-field">
                    <option value="">Válassz kategóriát...</option>
                </select>

                <button class="btn btn-outline-green" onclick="hozzadNevezes()">Nevezés rögzítése</button>
            </div>

            <!-- Ide generáljuk a táblázatot -->
            <div id="nevezesekTableContainer">
                <p>Adatok betöltése...</p>
            </div>
        </div>

        <div id="tatamik" class="tab-content">
            <h2>Tatamik és Mérkőzések (Sorsolás)</h2>
            
            <!-- Sorsolás gomb -->
            <div class="add-form-container" style="background-color: #e2f0ff; border-color: #b8daff;">
                <p style="margin-right: 15px; font-weight: bold; color: #004085; display: flex; align-items: center;">
                    Sorsolás motor:
                </p>
                <!-- A sorsolás gomb most még csak egy teszt meccset generál, de később bekötjük az igazi sorsolas.js-be -->
                <button class="btn btn-outline-blue" onclick="tesztSorsolas()">Teszt Mérkőzés Generálása</button>
            </div>

            <!-- Két oszlopos elrendezés a tatamiknak és a meccseknek -->
            <div style="display: flex; gap: 20px; margin-top: 20px;">
                <!-- Bal oldal: Tatamik -->
                <div style="flex: 1;">
                    <h3>Elérhető Tatamik</h3>
                    <div id="tatamikTableContainer">
                        <p>Adatok betöltése...</p>
                    </div>
                </div>

                <!-- Jobb oldal: Meccsek -->
                <div style="flex: 2;">
                    <h3>Kisorsolt Mérkőzések listája</h3>
                    <div id="merkozesekTableContainer">
                        <p>Adatok betöltése...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JS a fülek kezeléséhez -->
    <script src="../JS/tabs.js"></script>
    <script src="../JS/admin_adatok.js"></script>
</body>
</html>

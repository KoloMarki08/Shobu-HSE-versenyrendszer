<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATAMI MASTER™ - Átirányítás...</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script>
        (function () {
            var isAdmin = false;
            try {
                var raw = localStorage.getItem('tatamiUser');
                var user = raw ? JSON.parse(raw) : null;
                isAdmin = !!(user && user.role && String(user.role).toUpperCase() === 'ADMIN');
            } catch (e) {}
            var search = window.location.search || '';
            var target = isAdmin ? ('admin.html' + search + '#tab-tatamik') : '../index.html';
            window.location.replace(target);
        })();
    </script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;padding:40px;text-align:center;background:#FAF8F5;color:#18181B;">
    <p>Ez az oldal összevonásra került az Admin Központ Sorsolás és Kiemelés menüjével. Átirányítás folyamatban...</p>
    <p><a id="fallbackLink" href="../index.html" style="color:#18181B;font-weight:700;">Tovább a megfelelő felületre</a></p>
    <script>
        (function () {
            var a = document.getElementById('fallbackLink');
            if (!a) return;
            try {
                var raw = localStorage.getItem('tatamiUser');
                var user = raw ? JSON.parse(raw) : null;
                if (user && user.role && String(user.role).toUpperCase() === 'ADMIN') {
                    a.href = 'admin.html' + (window.location.search || '') + '#tab-tatamik';
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
